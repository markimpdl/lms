<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Arab female avatar">
  <defs>
    <clipPath id="cf-clip"><circle cx="128" cy="128" r="128"/></clipPath>
  </defs>
  <g clip-path="url(#cf-clip)">
    <!-- background -->
    <rect width="256" height="256" fill="#FCE7F3"/>

    <!-- abaya body (dark) -->
    <path d="M16 256 Q16 200 60 182 Q92 174 128 174 Q164 174 196 182 Q240 200 240 256 Z"
          fill="#374151"/>

    <!-- hijab back drape behind shoulders (medium gray) -->
    <path d="M40 256 Q56 200 72 178 L72 156 Q60 130 80 96 Q102 56 128 52 Q154 56 176 96 Q196 130 184 156 L184 178 Q200 200 216 256 Z"
          fill="#9CA3AF"/>

    <!-- hijab fabric framing face (lighter) -->
    <path d="M76 130 Q70 70 128 58 Q186 70 180 130 Q180 168 168 188 L168 130 Q160 100 128 96 Q96 100 88 130 L88 188 Q76 168 76 130 Z"
          fill="#D1D5DB" stroke="#9CA3AF" stroke-width="2"/>

    <!-- neck -->
    <rect x="116" y="160" width="24" height="22" fill="#E8C4A0"/>

    <!-- face -->
    <ellipse cx="128" cy="128" rx="42" ry="50" fill="#E8C4A0"/>

    <!-- eyes -->
    <ellipse cx="110" cy="124" rx="3" ry="4" fill="#1F2937"/>
    <ellipse cx="146" cy="124" rx="3" ry="4" fill="#1F2937"/>

    <!-- eyelashes -->
    <path d="M104 120 L116 118" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M140 118 L152 120" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>

    <!-- eyebrows -->
    <path d="M100 110 Q110 105 120 110" stroke="#1F2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M136 110 Q146 105 156 110" stroke="#1F2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- subtle lips -->
    <path d="M120 152 Q128 156 136 152" stroke="#A0444A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
